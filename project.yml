name: NSMOD3105
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
targets:
  NSMOD3105:
    type: application
    platform: iOS
    sources:
      - path: NSMOD3105
    info:
      path: NSMOD3105/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsmod.converter
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
